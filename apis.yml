aid: fordefi
name: Fordefi
description: >-
  Fordefi is an institutional MPC (multi-party computation) wallet and digital-asset
  security platform for DeFi, trading, and on-chain payments. Its developer API lets
  teams programmatically create vaults across 10+ blockchain families (EVM, Bitcoin,
  Solana, Cosmos and more), manage addresses and assets, and build, approve, sign,
  and broadcast transactions under a policy engine with built-in AML screening and
  audit logging. Authentication combines a Bearer JWT access token with ECDSA
  (NIST P-256) request signing by a registered API Signer; state-changing calls
  support idempotency and a signed webhook event surface for real-time monitoring.
  Fordefi is SOC 2 Type II certified. This profile was enriched by the API
  Evangelist pipeline from Fordefi's public OpenAPI and developer documentation.
