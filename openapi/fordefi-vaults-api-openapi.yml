      - created_at
      - modified_at
      - name
      - created_by
      - vault_groups
      - are_all_chains_disabled
      - derivation_path
      - public_key_compressed
      - derivation_info
      - origin_type
      - state
      - type
      - raw_account
      - base64_url_bounceable_account
      - base64_url_non_bounceable_account
      - state_init
