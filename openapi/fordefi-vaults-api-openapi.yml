  /api/v1/vaults/export_async:
    get:
      tags:
      - Vaults
      summary: Export Vaults With Assets Async
      description: Get a CSV-format list of balances of all vaults and their assets.
      operationId: export_vaults_with_assets_async_api_v1_vaults_export_async_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          description: The number of vault/asset pairs to export, unlimited if not set.
          title: Limit
          type: integer
        description: The number of vault/asset pairs to export, unlimited if not set.
      - name: vaults_ids
        in: query
        required: false
        schema:
          description: Vault IDs to filter on.
          title: Vaults Ids
          type: array
          items:
            type: string
            format: uuid
        description: Vault IDs to filter on.
      - name: vault_types
        in: query
        required: false
        schema:
          description: Vault types to filter on.
          title: Vault Types
          type: array
          items:
            $ref: '#/components/schemas/VaultType'
        description: Vault types to filter on.
      responses:
        '200':
          description: Successful Response
          content:
