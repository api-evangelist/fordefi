      title: UserState
    CreateBlackBoxVaultRequest:
      properties:
        name:
          type: string
          minLength: 1
          title: Name
          description: The name of the vault.
        end_user_id:
          title: End User Id
          description: The end user id to create a vault for.This field is required for end-user vault creation, otherwise, it's optional. If not provided, the organization's default keyset will be used.
          type: string
          format: uuid
        vault_group_id:
          title: Vault Group Id
          description: The group to add this vault to. If not provided, the vault will be created in the Default vault group.
          type: string
          format: uuid
        import_options:
          description: 'Import options: use <VaultImportOrigin.IMPORTED_KEYS: ''imported_keys''> for organizations with imported keys, <VaultImportOrigin.EXTERNAL_SIGNER: ''external_signer''> to create a vault from an external public key and chain code.'
          oneOf:
          - $ref: '#/components/schemas/ImportVaultDefaultOptions'
          - $ref: '#/components/schemas/ExternalVaultImportOptions'
          discriminator:
            propertyName: origin
            mapping:
              external_signer: '#/components/schemas/ExternalVaultImportOptions'
              imported_keys: '#/components/schemas/ImportVaultDefaultOptions'
        import_vault:
          description: 'Additional information when creating a vault from an imported key. This field is relevant only for organizations using imported keys. Deprecated: use import_options with origin=imported_keys instead.'
          $ref: '#/components/schemas/ImportVaultDefaultOptions'
        type:
          type: string
          const: black_box
          title: Type
          description: Black Box vault type.
        key_type:
          type: string
          enum:
          - ecdsa_stark
          - ecdsa_secp256k1
          - eddsa_ed25519
          - schnorr_secp256k1
          title: Key Type
          description: 'The key type of the signing scheme used by the vault. Can be: <ul>   <li>`ecdsa_stark`</li>   <li>`ecdsa_secp256k1`</li>   <li>`eddsa_ed25519`</li>   <li>`schnorr_secp256k1`</li></ul>'
