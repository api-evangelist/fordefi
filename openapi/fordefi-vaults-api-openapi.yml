    TonVault:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The unique identifier of the object in the Fordefi platform.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time when the object was created.
        modified_at:
          type: string
          format: date-time
          title: Modified At
          description: The date and time when the object was last modified. Any change to any field of the resource is considered a modification.
        metadata:
          title: Metadata
          description: 'Metadata in a form: <str, bool | str | int | array[str]>.'
          additionalProperties:
            anyOf:
            - items:
                type: string
              type: array
            - type: string
            - type: integer
            - type: boolean
          type: object
        name:
          type: string
          title: Name
          description: The name of the vault.
        created_by:
          $ref: '#/components/schemas/UserRef'
          description: Details of the vault creator.
        vault_group:
          description: The vault group this vault belongs to.
          deprecated: true
          $ref: '#/components/schemas/VaultGroupRef'
        vault_groups:
          items:
            $ref: '#/components/schemas/VaultGroupRef'
          type: array
          title: Vault Groups
          description: The vault groups this vault belongs to.
        skip_indexing_reason:
          description: Reason why the vault is not being indexed.
          $ref: '#/components/schemas/SkipIndexingReason'
        is_external_signer:
          type: boolean
          title: Is External Signer
          description: Whether the vault uses an externally imported key (external signer).
          default: false
        native_assets:
          title: Native Assets
          description: List of native asset information for requested chains. Chain info is in asset_identifier.
          items:
            $ref: '#/components/schemas/OwnedAsset'
          type: array
        derivation_path:
          title: Derivation Path
          description: The BIP 44 derivation path of the vault.
          deprecated: true
          example: m/44/60/0/0/0
          type: string
        public_key_compressed:
          type: string
          title: Public Key Compressed
          description: 'The public key of the vault in its compressed form: <ul> <li>For ECDSA and Schnorr keys, the public key is represented as 33 bytes (0x02 or 0x03 followed by the x-coordinate) according to the [SEC1 standard](https://www.secg.org/SEC1-Ver-1.0.pdf). <li>For EdDSA, the public key is represented as a 32-byte value, as defined by [RFC 8032](https://datatracker.ietf.org/doc/html/rfc8032). </ul>'
          example: SGVsbG8=
        derivation_info:
          $ref: '#/components/schemas/VaultDerivationInfo'
          description: The derivation info of the vault.
        key_holder:
          description: The user who owns the keyset of the vault. If not provided, the vault is owned by the organization.
          $ref: '#/components/schemas/EndUserRef'
        origin_type:
          $ref: '#/components/schemas/VaultOriginType'
          description: The origin type of the vault.
        state:
          $ref: '#/components/schemas/MpcVaultState'
          description: New state of the vault.
        type:
          type: string
          const: ton
          title: Type
          description: TON vault type.
        raw_account:
          type: string
          maxLength: 67
          pattern: ^[-0-9]+:[A-Fa-f0-9]{64}$
          title: Raw Account
          description: The address TON contract in a raw format.
        base64_url_bounceable_account:
          type: string
          maxLength: 48
          minLength: 48
          title: Base64 Url Bounceable Account
          description: The bounceable address of the contract in base64 url format
          example: UQBxs5hnTxjzvzsnDofRfbJeXsylUcxR8OSW7UUv317csHZ1
        base64_url_non_bounceable_account:
          type: string
          maxLength: 48
          minLength: 48
          title: Base64 Url Non Bounceable Account
          description: The non-bounceable address of the contract in base64 url format
          example: UQBxs5hnTxjzvzsnDofRfbJeXsylUcxR8OSW7UUv317csHZ1
        state_init:
          type: string
          title: State Init
          description: The wallet contract state init.
      type: object
      required:
