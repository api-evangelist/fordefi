    UtxoTransaction:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The unique identifier of the object in the Fordefi platform.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time when the object was created.
        modified_at:
          type: string
          format: date-time
          title: Modified At
          description: The date and time when the object was last modified. Any change to any field of the resource is considered a modification.
        managed_transaction_data:
          description: 'Managed transaction data. Presented if the transaction was initiated from the Fordefi system itself, in contrast to unmanaged transactions (which are, for example, transfers of funds into a vault visible to Fordefi). '
          $ref: '#/components/schemas/ManagedTransactionData'
        signatures:
          items:
            $ref: '#/components/schemas/Signature'
          type: array
          title: Signatures
          description: The transaction signatures.
        note:
          title: Note
          description: An optional transaction note.
          type: string
        spam_state:
          $ref: '#/components/schemas/TransactionSpamState'
          description: '`automatically_set` if the transaction was automatically set as spam by Fordefi, `manually_set` if the transaction was manually set as spam by a user, and `unset` if the transaction was not set as spam.'
          default: unset
        direction:
          $ref: '#/components/schemas/TransactionDirection'
          description: The direction of the transaction.
        signed_externally:
          type: boolean
          title: Signed Externally
          description: Whether the transaction was signed by an external user (for example in case of imported vault).
          default: false
        interacted_vaults:
          items:
            $ref: '#/components/schemas/VaultRef'
          type: array
          title: Interacted Vaults
          description: The vaults that interacted with the transaction.
        related_transactions:
          title: Related Transactions
          description: The related transactions.
          items:
            $ref: '#/components/schemas/RelatedTransaction'
          type: array
        organization_id:
          type: string
          format: uuid
          title: Organization Id
          description: The organization that the transaction belongs to.
        block:
          description: The block of the transaction.
          $ref: '#/components/schemas/Block'
        state:
          $ref: '#/components/schemas/PushableTransactionState'
          description: The state of the transaction.
        state_changes:
          items:
            $ref: '#/components/schemas/PushableTransactionStateChange'
          type: array
          title: State Changes
          description: The state changes of the transaction.
        aml_check:
          description: The AML check.
          $ref: '#/components/schemas/AmlCheck'
        mined_result_status:
          description: The mined result status of the transaction.
          $ref: '#/components/schemas/MinedResultStatus'
        simulation_status_result:
          description: Whether simulation succeeded, reverted or failed.
          $ref: '#/components/schemas/SimulationStatusResult'
        parent_transaction_id:
          title: Parent Transaction Id
          description: The unique identifier of the parent transaction. Parent and child transactions form in cases where a transaction become stuck and is then either canceled or accelerated. If, for example, the original transaction (`t1`) is the parent and the related, adjustment transaction is the child (`t2`), then relative to itself, the parent field of `t1` is `null` and the child field is `t2_id`. Compare with field `child_transaction_id`.
          type: string
          format: uuid
        child_transaction_id:
          title: Child Transaction Id
          description: 'The unique identifier of the child transaction. Compare with field `parent_transaction_id`. Relative to itself, the parent field of transaction `t2` would aquire the identifier `t1_id` and the child field of `t2` would be `null`. '
          type: string
          format: uuid
        is_cancelation:
          type: boolean
          title: Is Cancelation
          description: '`True` if this transaction is a cancelation of a previous transaction, `False` otherwise. '
        is_acceleration:
          type: boolean
          title: Is Acceleration
          description: '`True` if this transaction is an acceleration of a previous transaction, `False` otherwise.'
        type:
          type: string
          const: utxo_transaction
          title: Type
          description: The type of the transaction.
        utxo_transaction_type_details:
          oneOf:
          - $ref: '#/components/schemas/UtxoNativeTransferDetails'
          - $ref: '#/components/schemas/UtxoPsbtDetails'
          description: Details of UTXO transaction, based on its type.
          discriminator:
            propertyName: type
            mapping:
              native_transfer: '#/components/schemas/UtxoNativeTransferDetails'
              partially_signed_bitcoin_transaction: '#/components/schemas/UtxoPsbtDetails'
        chain:
          $ref: '#/components/schemas/EnrichedUtxoChain'
          description: Details of the chain this transaction is on.
        hash:
          title: Hash
          description: The hash of the transaction.
          type: string
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer.
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
        expected_result:
          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/UtxoTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/UtxoTransactionResult'
        dlc_data:
          description: The DLC data of the transaction, if the transaction is part of a DLC contract.
          $ref: '#/components/schemas/DlcDataResponse'
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - is_cancelation
      - is_acceleration
      - type
      - utxo_transaction_type_details
      - chain
      title: UtxoTransaction
