    BatchSolanaTransactionRequestDetails:
      properties:
        fee:
          description: The fee configuration for the transaction.
          oneOf:
          - $ref: '#/components/schemas/SolanaCustomFeeRequest'
          - $ref: '#/components/schemas/SolanaPriorityFeeRequest'
          discriminator:
            propertyName: type
            mapping:
              custom: '#/components/schemas/SolanaCustomFeeRequest'
              priority: '#/components/schemas/SolanaPriorityFeeRequest'
        type:
          type: string
          const: solana_raw_transaction
          title: Type
          description: A Solana raw transaction is for any operation.
        fail_on_prediction_failure:
          type: boolean
          title: Fail On Prediction Failure
          description: '`True` if the request should fail in case simulation failed, `False` otherwise. <br> In case simulation has failed upon continuation, the expected result of the transaction will be partial and policy will be applied on information that can be extracted statically from the transaction only. This might result in falling back to the default policy rule. '
          default: true
        skip_simulation:
          type: boolean
          title: Skip Simulation
          description: '`True` to create a transaction without prediction, `False` otherwise. <br> In case of skipping simulation, the `simulation_status` will be `skipped` and the `expected_result` of the transaction will be empty. The policy will be applied on information that can be extracted statically from the transaction only. This might result in falling back to the default policy rule. <br> Note, it is recommended to use the default setting for this field and to turn off `fail_on_prediction_failure` instead - unless you wish to save time by omitting the prediction phase entirely. '
          default: false
        chain:
          $ref: '#/components/schemas/SolanaChainUniqueId'
          description: The chain that this transaction is on. Specify the chain name (for example, `solana_mainnet`).
        transactions:
          items:
            $ref: '#/components/schemas/BatchSolanaTransactionInstanceDetails'
          type: array
          minItems: 1
          title: Transactions
          description: Details of the transactions in the batch.
      type: object
      required:
      - type
      - chain
      - transactions
      title: BatchSolanaTransactionRequestDetails
