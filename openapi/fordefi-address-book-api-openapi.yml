    CantonAddressBookContact:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The unique identifier of the object in the Fordefi platform.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time when the object was created.
        modified_at:
          type: string
          format: date-time
          title: Modified At
          description: The date and time when the object was last modified. Any change to any field of the resource is considered a modification.
        name:
          type: string
          title: Name
          description: The name of the contact.
        modified_by:
          $ref: '#/components/schemas/UserRef'
          description: Address last modifier.
        state:
          $ref: '#/components/schemas/AddressBookContactState'
          description: The state of the contact.
        groups:
          items:
            $ref: '#/components/schemas/GroupRef'
          type: array
          title: Groups
          description: List of contact's groups.
        pending_changes:
          description: Pending changes for the contact.
          $ref: '#/components/schemas/AddressBookContactChanges'
        asset_infos:
          items:
            $ref: '#/components/schemas/AssetInfo'
          type: array
          title: Asset Infos
          description: A list of asset infos for the contact. Can be used to enforce trading of specific assets intransfers to this address
        chain_type:
          type: string
          const: canton
          title: Chain Type
          description: The type of the chain.
        address:
          type: string
          maxLength: 251
          minLength: 70
          title: Address
          description: The party id on the Canton chain.
          example: 45b72ac2a9742204e6e5f521781b0648::122028536bd166988ebbb422c7f483bb32d4134127e8c171c9666ce9b518e1dd27cf
        chains:
          items:
            $ref: '#/components/schemas/EnrichedCantonChain'
          type: array
          title: Chains
          description: The chains the contact belongs to. If empty, the contact is associated with all chains.
        memo:
          title: Memo
          description: Memo is an additional address feature used for identifying a recipient.
          type: string
      type: object
      required:
      - id
      - created_at
      - modified_at
      - name
      - modified_by
      - state
      - groups
      - asset_infos
      - chain_type
      - address
      - chains
      title: CantonAddressBookContact
      description: Represents a contact in the Fordefi platform
