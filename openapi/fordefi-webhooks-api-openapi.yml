          description: Whether the transaction was signed by an external user (for example in case of imported vault).
          default: false
        interacted_vaults:
          items:
            $ref: '#/components/schemas/VaultRef'
          type: array
          title: Interacted Vaults
          description: The vaults that interacted with the transaction.
        related_transactions:
          title: Related Transactions
          description: The related transactions.
          items:
            $ref: '#/components/schemas/RelatedTransaction'
          type: array
        organization_id:
          type: string
          format: uuid
          title: Organization Id
          description: The organization that the transaction belongs to.
        block:
          description: The block of the transaction.
          $ref: '#/components/schemas/Block'
        state:
          $ref: '#/components/schemas/PushableTransactionState'
          description: 'The current status of the transaction. Can be one of the following: <ul><li>`waiting_for_approval`: If a transaction has not been auto-approved, it waits in this state until it has received all the required approvals.<li>`approved`: The transaction moves into this state on approval. Then, a notification is sent to the mobile device of the creator of the transaction for signing or to the API Signer (depending on the flow that was defined). The transaction remains in this state until it is signed.<li>`pushed_to_blockchain`: Once signed, the transaction is pushed to the blockchain, awaiting mining. From that moment, control of the transaction passes from Fordefi to the blockchain. This status resolves into one of the following: `completed`, `reverted`, `stuck`.<li>`completed`: The transaction was successfully mined into the blockchain.<li>`reverted`: The transaction was mined into the blockchain and was then reverted.<li>`stuck`: The transaction did not reach `completed` or `reverted` after 24 hours.<li>`error_pushing_to_blockchain`: Failed to push the transaction to the blockchain.<li>`aborted`: Either the transaction was not approved or the transaction was approved but the creator aborted the process.</ul> For more information about statuses in the transaction lifecycle, see: [Transaction Lifecycle](https://docs.fordefi.com/docs/transaction-lifecycle). '
        state_changes:
          items:
            $ref: '#/components/schemas/PushableTransactionStateChange'
          type: array
          title: State Changes
          description: The state changes of the transaction.
        aml_check:
          description: The AML check.
          $ref: '#/components/schemas/AmlCheck'
        mined_result_status:
          description: The mined result status of the transaction.
          $ref: '#/components/schemas/MinedResultStatus'
        simulation_status_result:
          description: Whether simulation succeeded, reverted or failed.
          $ref: '#/components/schemas/SimulationStatusResult'
        parent_transaction_id:
          title: Parent Transaction Id
          description: The unique identifier of the parent transaction. Parent and child transactions form in cases where a transaction become stuck and is then either canceled or accelerated. If, for example, the original transaction (`t1`) is the parent and the related, adjustment transaction is the child (`t2`), then relative to itself, the parent field of `t1` is `null` and the child field is `t2_id`. Compare with field `child_transaction_id`.
          type: string
          format: uuid
        child_transaction_id:
          title: Child Transaction Id
          description: 'The unique identifier of the child transaction. Compare with field `parent_transaction_id`. Relative to itself, the parent field of transaction `t2` would aquire the identifier `t1_id` and the child field of `t2` would be `null`. '
          type: string
          format: uuid
        is_cancelation:
          type: boolean
          title: Is Cancelation
          description: '`True` if this transaction is a cancelation of a previous transaction, `False` otherwise. '
        is_acceleration:
          type: boolean
          title: Is Acceleration
          description: '`True` if this transaction is an acceleration of a previous transaction, `False` otherwise.'
        type:
          type: string
          const: evm_transaction
          title: Type
          description: EVM transaction type.
        evm_transaction_type_details:
          oneOf:
          - $ref: '#/components/schemas/EvmNativeTransferDetails'
          - $ref: '#/components/schemas/TokenTransferDetails'
          - $ref: '#/components/schemas/AllowanceDetails'
          - $ref: '#/components/schemas/ContractCallDetails'
          - $ref: '#/components/schemas/ContractDeploymentDetails'
          - $ref: '#/components/schemas/BridgeDetails'
          - $ref: '#/components/schemas/SetCodeDetails'
          description: Details of the EVM transaction based on its type.
          discriminator:
            propertyName: type
            mapping:
              allowance: '#/components/schemas/AllowanceDetails'
              contract_call: '#/components/schemas/ContractCallDetails'
              contract_deployment: '#/components/schemas/ContractDeploymentDetails'
              cross_chain_bridge: '#/components/schemas/BridgeDetails'
              native_transfer: '#/components/schemas/EvmNativeTransferDetails'
              set_code: '#/components/schemas/SetCodeDetails'
              token_transfer: '#/components/schemas/TokenTransferDetails'
        chain:
          $ref: '#/components/schemas/EnrichedEvmChain'
          description: The details of the chain this transaction is on.
        from:
          $ref: '#/components/schemas/EnrichedEvmAddress'
          description: The sender of the transaction.
        to:
          $ref: '#/components/schemas/EnrichedEvmAddress'
          description: The address of the recipient of the transaction.
        value:
          type: string
          pattern: ^\d+$
          title: Value
          description: The value of native currency sent with this transaction.
          example: '1000000000000000000'
        data:
          type: string
          title: Data
          description: The data of the contract call, as a serialized method-call with its arguments, in Base64 format. See [data field format for transactions on Ethereum](https://ethereum.org/en/developers/docs/transactions/#the-data-field).
          example: SGVsbG8=
        hex_data:
          title: Hex Data
          description: The hex data of the contract call, as a serialized method-call with its arguments.
          type: string
          pattern: ^0[xX][a-fA-F0-9]+$
        parsed_data:
          $ref: '#/components/schemas/EvmTransactionParsedData'
          description: The parsed data of the transaction.
        hash:
          title: Hash
          description: The hash of the transaction.
          type: string
          maxLength: 66
          minLength: 66
          pattern: ^0[xX][a-fA-F0-9]+$
          example: '0x780f21260f89d610f24eed21b34d29229611a37e0003e83dd0da91981d7131ae'
        nonce:
          title: Nonce
          description: The nonce of the transaction.
          type: integer
        expected_result:
          description: The expected (simulated) result of the transaction.
          $ref: '#/components/schemas/EvmTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/EvmTransactionResult'
        gas_submitted:
          oneOf:
          - $ref: '#/components/schemas/LegacyGas'
          - $ref: '#/components/schemas/DynamicGas'
          description: The gas details submitted for the transaction.
          discriminator:
            propertyName: type
            mapping:
              dynamic: '#/components/schemas/DynamicGas'
              legacy: '#/components/schemas/LegacyGas'
        funding_for_transaction_id:
          title: Funding For Transaction Id
          description: Funding transaction ID.
          type: string
          format: uuid
        funded_by_transaction_id:
          title: Funded By Transaction Id
          description: Funded transaction ID.
          type: string
          format: uuid
        funded_by_vault:
          description: Funding vault.
          deprecated: true
          $ref: '#/components/schemas/VaultRef'
        current_preceding_pushed_to_blockchain_transaction_id:
          title: Current Preceding Pushed To Blockchain Transaction Id
          description: The unique identifier of the transaction that was pushed to the blockchain, In case this transaction is QUEUED.
          type: string
          format: uuid
        use_secure_node:
          title: Use Secure Node
          description: '`True` if Fordefi sends this transaction through a secure node, `False` otherwise. By using a secure node, you avoid maximal extractable value (MEV) attacks.'
          deprecated: true
          type: boolean
        use_mev_protected_node:
          type: boolean
          title: Use Mev Protected Node
          description: '`True` if Fordefi sends this transaction through an MEV protected node, `False` otherwise. By using an MEV protected node, you avoid maximal extractable value (MEV) attacks.'
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer.
          example: https://etherscan.io/tx/0x123
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
        raw_transaction:
          title: Raw Transaction
          description: The raw transaction data, encoded as a hex string.
          type: string
          pattern: ^0[xX][a-fA-F0-9]+$
        fee_payer:
          description: The address that pays the fee for this transaction (from address).
          $ref: '#/components/schemas/EnrichedEvmAddress'
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - is_cancelation
      - is_acceleration
      - type
      - evm_transaction_type_details
      - chain
      - from
      - to
      - value
      - data
      - parsed_data
      - gas_submitted
      - use_mev_protected_node
      title: EvmTransaction
