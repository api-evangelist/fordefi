          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/AptosTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/AptosTransactionResult'
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer. For example, explorer.aptoslabs.com
          example: https://explorer.aptoslabs.com/txn/0xe2b537430a0b30d05272f4cb99945d3355fdcb5d1390b348cdc320645786799d?network=mainnet
          type: string
          maxLength: 2083
          minLength: 1
