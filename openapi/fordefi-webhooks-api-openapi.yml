          $ref: '#/components/schemas/PushableTransactionState'
          description: The state of the transaction.
        state_changes:
          items:
            $ref: '#/components/schemas/PushableTransactionStateChange'
          type: array
          title: State Changes
          description: The state changes of the transaction.
        aml_check:
          description: The AML check.
          $ref: '#/components/schemas/AmlCheck'
        mined_result_status:
          description: The mined result status of the transaction.
          $ref: '#/components/schemas/MinedResultStatus'
        simulation_status_result:
          description: Whether simulation succeeded, reverted or failed.
          $ref: '#/components/schemas/SimulationStatusResult'
        type:
          type: string
          const: arch_transaction
          title: Type
          description: The type of the transaction.
        arch_transaction_type_details:
          oneOf:
          - $ref: '#/components/schemas/ArchNativeTransferDetails'
          - $ref: '#/components/schemas/ArchTokenTransferDetails'
          - $ref: '#/components/schemas/ArchRawTransactionDetails'
          description: Details of the Arch transaction based on its type.
          discriminator:
            propertyName: type
            mapping:
              native_transfer: '#/components/schemas/ArchNativeTransferDetails'
              raw_transaction: '#/components/schemas/ArchRawTransactionDetails'
              token_transfer: '#/components/schemas/ArchTokenTransferDetails'
        chain:
          $ref: '#/components/schemas/EnrichedArchChain'
          description: The details of the chain this transaction is on.
        instructions:
          items:
            $ref: '#/components/schemas/ArchCompiledInstruction'
          type: array
          title: Instructions
          description: The instructions of the transaction.
        accounts:
          items:
            $ref: '#/components/schemas/ArchTransactionAccount'
          type: array
          title: Accounts
          description: Accounts used in the transaction.
        sender:
          $ref: '#/components/schemas/EnrichedArchAddress'
          description: The sender of the transaction.
        raw_transaction:
          title: Raw Transaction
          description: The serialized transaction encoded as a base64 string
          type: string
          example: SGVsbG8=
        hash:
          title: Hash
          description: The hash of the transaction.
          type: string
        recent_blockhash:
          title: Recent Blockhash
          description: The transaction nonce (last block hash).
          type: string
        expected_result:
          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/ArchTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/ArchTransactionResult'
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer. For example, gomaestro
          example: https://explorer.gomaestro.org/arch/testnet/tx/1234567890
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - type
      - arch_transaction_type_details
      - chain
      - instructions
      - accounts
      - sender
      title: ArchTransaction
