              stake: '#/components/schemas/TronStakeDetails'
              token_transfer: '#/components/schemas/TronTokenTransferDetails'
              undelegate: '#/components/schemas/TronUndelegateDetails'
              unstake: '#/components/schemas/TronUnstakeDetails'
        chain:
          $ref: '#/components/schemas/EnrichedTronChain'
          description: The details of the chain this transaction is on.
        sender:
          $ref: '#/components/schemas/EnrichedTronAddress'
          description: The sender of the transaction.
        hash:
          title: Hash
          description: The hash of the transaction.
          type: string
          maxLength: 64
          minLength: 64
          pattern: ^[a-fA-F0-9]+$
          example: 32bd287f0d6c5fde3381cca851fb7c021cc9782165c08078d9a8554163a86b17
        serialized_signed_transaction:
          title: Serialized Signed Transaction
          description: The serialized signed transaction.
          type: string
        expected_result:
          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/TronTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/TronTransactionResult'
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer. For example, https://explorer.hiro.so/
          example: https://explorer.hiro.so/txid/0xd303fc22b2b8c346a0a1fa164a1ccb878a172dc2b8ce08253a6b2312cafb1520
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
        memo:
          title: Memo
          description: The memo of the transaction.
          type: string
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - type
      - tron_transaction_type_details
      - chain
      - sender
      title: TronTransaction
    StateChangeReason:
      type: string
      enum:
      - failed_to_verify_signature
      - original_transaction_was_completed
      - stale_nonce
      - quote_expired
      - another_dlc_transaction_was_completed
      - fee_limit_exceeded
      - not_in_mempool_or_chain
      - exchange_withdraw_address_not_whitelisted
      - exchange_invalid_api_key_permissions
      - exchange_funds_pending_settlement
      - exchange_withdrawal_limit_exceeded
      - exchange_security_and_policy_holds
      - exchange_service_unavailable
      title: StateChangeReason
    ApprovalRequest:
      properties:
        state:
          $ref: '#/components/schemas/ApprovalRequestState'
          description: The state of the approval request.
        required_groups:
          type: integer
          title: Required Groups
          description: The number of required approval groups.
        approval_groups:
          items:
            $ref: '#/components/schemas/ApprovalRequestGroup'
          type: array
          title: Approval Groups
          description: A list of the possible approvers from different groups.
        error_message:
          title: Error Message
          description: The error message if the request failed.
          type: string
      type: object
      required:
      - state
      - required_groups
      - approval_groups
      title: ApprovalRequest
      description: Represents an approval request for an action in the Fordefi platform
    TronTransactionResult:
      properties:
        reversion:
          $ref: '#/components/schemas/TronReversion'
          description: Details whether the transaction was reverted or not.
        fee:
          $ref: '#/components/schemas/TronFee'
          description: The fees of the transaction.
        effects:
          $ref: '#/components/schemas/TronEffects'
          description: The effects of the transaction.
      type: object
      required:
      - reversion
      - fee
      - effects
      title: TronTransactionResult
    StellarMessageType:
      type: string
      enum:
      - personal_message
      title: StellarMessageType
    ExchangeType:
      type: string
      enum:
      - binance
      - bybit
      - coinbase_international
      - coinbase_us
      - okx
      - kraken
      title: ExchangeType
    StarknetReversionState:
      type: string
      enum:
      - not_reverted
      - unknown_revert
      - contract_asserted
      - insufficient_funds_gas_and_value
      title: StarknetReversionState
    SignMode:
      type: string
      enum:
      - auto
      - triggered
      title: SignMode
    CantonTransaction:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The unique identifier of the object in the Fordefi platform.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time when the object was created.
        modified_at:
          type: string
          format: date-time
          title: Modified At
          description: The date and time when the object was last modified. Any change to any field of the resource is considered a modification.
        managed_transaction_data:
          description: 'Managed transaction data. Presented if the transaction was initiated from the Fordefi system itself, in contrast to unmanaged transactions (which are, for example, transfers of funds into a vault visible to Fordefi). '
          $ref: '#/components/schemas/ManagedTransactionData'
        signatures:
          items:
            $ref: '#/components/schemas/Signature'
          type: array
          title: Signatures
          description: The transaction signatures.
        note:
          title: Note
          description: An optional transaction note.
          type: string
        spam_state:
          $ref: '#/components/schemas/TransactionSpamState'
          description: '`automatically_set` if the transaction was automatically set as spam by Fordefi, `manually_set` if the transaction was manually set as spam by a user, and `unset` if the transaction was not set as spam.'
          default: unset
        direction:
          $ref: '#/components/schemas/TransactionDirection'
          description: The direction of the transaction.
        signed_externally:
          type: boolean
          title: Signed Externally
          description: Whether the transaction was signed by an external user (for example in case of imported vault).
          default: false
        interacted_vaults:
          items:
            $ref: '#/components/schemas/VaultRef'
          type: array
          title: Interacted Vaults
          description: The vaults that interacted with the transaction.
        related_transactions:
          title: Related Transactions
          description: The related transactions.
          items:
            $ref: '#/components/schemas/RelatedTransaction'
          type: array
        organization_id:
          type: string
          format: uuid
          title: Organization Id
          description: The organization that the transaction belongs to.
        block:
          description: The block of the transaction.
          $ref: '#/components/schemas/Block'
        state:
          $ref: '#/components/schemas/PushableTransactionState'
          description: The state of the transaction.
        state_changes:
          items:
            $ref: '#/components/schemas/PushableTransactionStateChange'
          type: array
          title: State Changes
          description: The state changes of the transaction.
        aml_check:
          description: The AML check.
          $ref: '#/components/schemas/AmlCheck'
        mined_result_status:
          description: The mined result status of the transaction.
          $ref: '#/components/schemas/MinedResultStatus'
        simulation_status_result:
          description: Whether simulation succeeded, reverted or failed.
          $ref: '#/components/schemas/SimulationStatusResult'
        type:
          type: string
          const: canton_transaction
          title: Type
          description: Canton transaction type.
        canton_transaction_type_details:
          oneOf:
          - $ref: '#/components/schemas/CantonNativeTransferDetails'
          - $ref: '#/components/schemas/CantonTokenTransferDetails'
          - $ref: '#/components/schemas/CantonPartyAllocationDetails'
          - $ref: '#/components/schemas/CantonApproveTransferDetails'
          - $ref: '#/components/schemas/CantonPreApprovalSetupDetails'
          description: Details of the Canton transaction based on its type.
          discriminator:
            propertyName: type
            mapping:
              approve_transfer: '#/components/schemas/CantonApproveTransferDetails'
              native_transfer: '#/components/schemas/CantonNativeTransferDetails'
              party_allocation: '#/components/schemas/CantonPartyAllocationDetails'
              pre_approval_setup: '#/components/schemas/CantonPreApprovalSetupDetails'
              token_transfer: '#/components/schemas/CantonTokenTransferDetails'
        chain:
          $ref: '#/components/schemas/EnrichedCantonChain'
          description: The details of the chain this transaction is on.
        sender:
          $ref: '#/components/schemas/EnrichedCantonAddress'
          description: The sender of the transaction.
        recipient:
          description: The recipient of the assets.
          $ref: '#/components/schemas/EnrichedCantonAddress'
        expected_result:
          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/CantonTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/CantonTransactionResult'
        memo:
          title: Memo
          description: Optional memo attached to the transfer.
          type: string
        approval_status:
          description: The approval status of the transaction. Set to 'requires_approval' when the receiver must accept an incoming transfer, 'approved' once the transfer has settled (including auto-accept via pre-approval), or 'expired' when the transfer window has elapsed before acceptance.
          $ref: '#/components/schemas/CantonApprovalStatus'
        approval_expires_at:
          title: Approval Expires At
          description: Only set when `approval_status` is `requires_approval`. The sender's `executeBefore` on the pending TransferInstruction — the receiver must accept before this time or the transfer expires.
          type: string
          format: date-time
        hash:
          title: Hash
          description: The on-ledger update id of the transaction.
          type: string
        explorer_url:
          title: Explorer Url
          description: Link to view the transaction on the block explorer.
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - type
      - canton_transaction_type_details
      - chain
      - sender
      title: CantonTransaction
    Permit2TypedMessageEvmMessage:
