          type: string
          const: starknet_message
          title: Type
          description: Starknet message type.
        starknet_message_type:
          $ref: '#/components/schemas/StarknetMessageType'
          description: The type of the Starknet message.
        raw_data:
          type: string
          title: Raw Data
          description: The raw data of the message.
        chain:
          $ref: '#/components/schemas/EnrichedStarknetChain'
          description: The details of the chain that this message is on.
        sender:
          $ref: '#/components/schemas/EnrichedStarknetAddress'
          description: The sender of the message.
        message_hash:
          type: string
          maxLength: 66
          minLength: 66
          pattern: ^0[xX][a-fA-F0-9]+$
          title: Message Hash
          description: The hash of the message that was requested to be signed, in hex.
          example: '0x0684532b069fb0ce7e22041538a1c5e4850aafae042c772393cd7d795b767c74'
        starknet_signatures:
          items:
            type: string
          type: array
          title: Starknet Signatures
          description: The signatures of the message in Starknet format.
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - type
