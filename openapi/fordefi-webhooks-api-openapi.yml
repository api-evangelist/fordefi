    Erc721:
      properties:
        address:
          $ref: '#/components/schemas/EvmAddress'
          description: The token address
        name:
          type: string
          title: Name
          description: The token name
        symbol:
          type: string
          title: Symbol
          description: The token symbol or ticker
        type:
          type: string
          const: erc721
          title: Type
          description: The type of the token
      type: object
      required:
      - address
      - name
      - symbol
      - type
      title: Erc721
    SuiChainUniqueId:
      type: string
      enum:
      - sui_mainnet
      - sui_testnet
      title: SuiChainUniqueId
    TonRawTransactionDetails:
      properties:
        type:
          type: string
          const: raw_transaction
          title: Type
          description: A transaction with a contract call.
        recipients:
          items:
            $ref: '#/components/schemas/EnrichedTonAddress'
          type: array
          title: Recipients
          description: The called contract.
      type: object
      required:
      - type
      - recipients
      title: TonRawTransactionDetails
    HyperliquidUsdClassTransferAction:
      properties:
        action_type:
          type: string
          const: usd_class_transfer
          title: Action Type
          description: The Hyperliquid action type.
        amount:
          type: string
          pattern: ^\d+(\.\d+)?$
          title: Amount
          description: Transfer amount as a decimal string.
          example: '1000000000000000000'
        to_perp:
          type: boolean
          title: To Perp
          description: Whether to move funds to perp (`true`) or to spot (`false`).
        nonce:
          type: integer
          title: Nonce
          description: Replay-protection nonce.
      type: object
      required:
      - action_type
      - amount
      - to_perp
      - nonce
      title: HyperliquidUsdClassTransferAction
      description: Move funds between spot and perp margin.
    SetCodeDetails:
      properties:
        type:
          type: string
          const: set_code
          title: Type
          description: A transaction that makes an EOA smart contract or disables it.
      type: object
      required:
      - type
      title: SetCodeDetails
    EndUserRef:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The unique identifier of the user in the Fordefi platform.
        user_type:
          type: string
          const: end_user
          title: User Type
          description: The type of the user.
        external_id:
          type: string
          title: External Id
          description: External id of the user.
          example: user|1234
        state:
          type: string
          enum:
          - active
          - deleted
          title: State
          description: The state of the user.
      type: object
      required:
      - id
      - user_type
      - external_id
      - state
      title: EndUserRef
    CosmosGasDebit:
      properties:
        gas_used:
          type: string
          pattern: ^\d+$
          title: Gas Used
          description: Gas used while processing the transaction.
          example: '1000000000000000000'
        total_fee:
          items:
            $ref: '#/components/schemas/CosmosCoinWithAmount'
          type: array
          title: Total Fee
          description: The total fee paid.
        fiat_prices:
          items:
            $ref: '#/components/schemas/Price'
          type: array
          title: Fiat Prices
          description: The prices of the coins used to pay the fee.
      type: object
      required:
      - gas_used
      - total_fee
      - fiat_prices
      title: CosmosGasDebit
    Signature:
      properties:
        data:
          type: string
          title: Data
          description: Signature on the transaction, encoded in base64 format.
          example: SGVsbG8=
        signed_by:
          description: The user who created this signature, `null` if the signature wasn't created by a Fordefi user.
          oneOf:
          - $ref: '#/components/schemas/PersonRef'
          - $ref: '#/components/schemas/ApiSignerRef'
          - $ref: '#/components/schemas/EndUserRef'
          - $ref: '#/components/schemas/ApiUserRef'
          discriminator:
            propertyName: user_type
            mapping:
              api_signer: '#/components/schemas/ApiSignerRef'
              api_user: '#/components/schemas/ApiUserRef'
              end_user: '#/components/schemas/EndUserRef'
              person: '#/components/schemas/PersonRef'
      type: object
      required:
      - data
      title: Signature
    CantonApproveTransferDetails:
      properties:
        type:
          type: string
          const: approve_transfer
          title: Type
          description: A transaction that approves pending incoming transfers.
      type: object
      required:
      - type
      title: CantonApproveTransferDetails
    EnrichedSolanaChain:
      properties:
        chain_type:
          type: string
          const: solana
          title: Chain Type
          description: The type of the chain.
        unique_id:
          $ref: '#/components/schemas/SolanaChainUniqueId'
          description: The type of the Solana-based chain.
        name:
          type: string
          minLength: 1
          title: Name
          description: The full blockchain name.
        native_currency_symbol:
          type: string
          minLength: 1
          title: Native Currency Symbol
          description: The native currency symbol.
          example: ETH
        native_currency_name:
          type: string
          minLength: 1
          title: Native Currency Name
          description: The native currency name.
          example: Ether
        blockchain_explorer:
          $ref: '#/components/schemas/BlockchainExplorer'
        logo_url:
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
          title: Logo Url
          description: The logo URL of the chain.
        is_testnet:
          type: boolean
          title: Is Testnet
          description: Whether the chain is on a testnet.
        is_enabled:
          type: boolean
          title: Is Enabled
          description: Whether the chain is enabled.
      type: object
      required:
      - chain_type
      - unique_id
      - name
      - native_currency_symbol
      - native_currency_name
      - logo_url
      - is_testnet
      - is_enabled
      title: EnrichedSolanaChain
    CantonNativeTransferDetails:
      properties:
        type:
          type: string
          const: native_transfer
          title: Type
          description: A transaction involving the transfer of native Canton currency from one address to another.
        is_internal:
          title: Is Internal
          description: Is this transfer an internal transfer between two vaults. None if the recipient is unknown.
          type: boolean
      type: object
      required:
      - type
      title: CantonNativeTransferDetails
    CosmosAssetIdentifier:
      properties:
        type:
          type: string
          const: cosmos
          title: Type
          description: Cosmos asset identifier type.
        details:
          oneOf:
          - $ref: '#/components/schemas/CosmosNativeAssetIdentifierRequest'
          - $ref: '#/components/schemas/CosmosTokenAssetIdentifierRequest'
          discriminator:
            propertyName: type
            mapping:
              native: '#/components/schemas/CosmosNativeAssetIdentifierRequest'
              token: '#/components/schemas/CosmosTokenAssetIdentifierRequest'
        chain:
          $ref: '#/components/schemas/EnrichedCosmosChain'
      type: object
      required:
      - type
      - details
      - chain
      title: CosmosAssetIdentifier
