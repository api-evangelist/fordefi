          description: The state of the transaction.
        state_changes:
          items:
            $ref: '#/components/schemas/PushableTransactionStateChange'
          type: array
          title: State Changes
          description: The state changes of the transaction.
        aml_check:
          description: The AML check.
          $ref: '#/components/schemas/AmlCheck'
        mined_result_status:
          description: The mined result status of the transaction.
          $ref: '#/components/schemas/MinedResultStatus'
        simulation_status_result:
          description: Whether simulation succeeded, reverted or failed.
          $ref: '#/components/schemas/SimulationStatusResult'
        type:
          type: string
          const: ton_transaction
          title: Type
          description: TON transaction type.
        ton_transaction_type_details:
          oneOf:
          - $ref: '#/components/schemas/TonNativeTransferDetails'
          - $ref: '#/components/schemas/TonJettonTransferDetails'
          - $ref: '#/components/schemas/TonRawTransactionDetails'
          description: Details of the Ton transaction based on its type.
          discriminator:
            propertyName: type
            mapping:
              jetton_transfer: '#/components/schemas/TonJettonTransferDetails'
              native_transfer: '#/components/schemas/TonNativeTransferDetails'
              raw_transaction: '#/components/schemas/TonRawTransactionDetails'
        chain:
          $ref: '#/components/schemas/EnrichedTonChain'
          description: The details of the chain this transaction is on.
        nonce:
          title: Nonce
          description: The nonce of the transaction.
          type: integer
        sender:
          $ref: '#/components/schemas/EnrichedTonAddress'
          description: The sender of the transaction.
        payload:
          $ref: '#/components/schemas/TonTransactionPayload'
          description: The payload of the transaction.
        hash:
          title: Hash
          description: The hash of the transaction.
          type: string
          maxLength: 64
          pattern: ^[a-fA-F0-9]+$
          example: c7482c1d424bdb2a555f069290a63ab144f3d06d34f944f6ae3505506b97989e
        serialized_signed_transaction:
          title: Serialized Signed Transaction
          description: The serialized signed transaction.
          type: string
          example: SGVsbG8=
        expected_result:
          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/TonTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/TonTransactionResult'
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer. For example, tonviewer.com
          example: https://tonviewer.com/transaction/a8e5ab8f0b452190ad81f92341b42c6cadd57d0e858b92e8113d70b02bf0bfaa
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
      type: object
      required:
