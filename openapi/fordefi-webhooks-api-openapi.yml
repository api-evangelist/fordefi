    SuiTransaction:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: The unique identifier of the object in the Fordefi platform.
        created_at:
          type: string
          format: date-time
          title: Created At
          description: The date and time when the object was created.
        modified_at:
          type: string
          format: date-time
          title: Modified At
          description: The date and time when the object was last modified. Any change to any field of the resource is considered a modification.
        managed_transaction_data:
          description: 'Managed transaction data. Presented if the transaction was initiated from the Fordefi system itself, in contrast to unmanaged transactions (which are, for example, transfers of funds into a vault visible to Fordefi). '
          $ref: '#/components/schemas/ManagedTransactionData'
        signatures:
          items:
            $ref: '#/components/schemas/Signature'
          type: array
          title: Signatures
          description: The transaction signatures.
        note:
          title: Note
          description: An optional transaction note.
          type: string
        spam_state:
          $ref: '#/components/schemas/TransactionSpamState'
          description: '`automatically_set` if the transaction was automatically set as spam by Fordefi, `manually_set` if the transaction was manually set as spam by a user, and `unset` if the transaction was not set as spam.'
          default: unset
        direction:
          $ref: '#/components/schemas/TransactionDirection'
          description: The direction of the transaction.
        signed_externally:
          type: boolean
          title: Signed Externally
          description: Whether the transaction was signed by an external user (for example in case of imported vault).
          default: false
        interacted_vaults:
          items:
            $ref: '#/components/schemas/VaultRef'
          type: array
          title: Interacted Vaults
          description: The vaults that interacted with the transaction.
        related_transactions:
          title: Related Transactions
          description: The related transactions.
          items:
            $ref: '#/components/schemas/RelatedTransaction'
          type: array
        organization_id:
          type: string
          format: uuid
          title: Organization Id
          description: The organization that the transaction belongs to.
        block:
          description: The block of the transaction.
          $ref: '#/components/schemas/Block'
        state:
          $ref: '#/components/schemas/PushableTransactionState'
          description: The state of the transaction.
        state_changes:
          items:
            $ref: '#/components/schemas/PushableTransactionStateChange'
          type: array
          title: State Changes
          description: The state changes of the transaction.
        aml_check:
          description: The AML check.
          $ref: '#/components/schemas/AmlCheck'
        mined_result_status:
          description: The mined result status of the transaction.
          $ref: '#/components/schemas/MinedResultStatus'
        simulation_status_result:
          description: Whether simulation succeeded, reverted or failed.
          $ref: '#/components/schemas/SimulationStatusResult'
        type:
          type: string
          const: sui_transaction
          title: Type
          description: Sui transaction type.
        sui_transaction_type_details:
          oneOf:
          - $ref: '#/components/schemas/SuiNativeTransferDetails'
          - $ref: '#/components/schemas/SuiCoinTransferDetails'
          - $ref: '#/components/schemas/SuiProgrammableTransactionBlockDetails'
          description: Details of the Sui transaction based on its type.
          discriminator:
            propertyName: type
            mapping:
              coin_transfer: '#/components/schemas/SuiCoinTransferDetails'
              native_transfer: '#/components/schemas/SuiNativeTransferDetails'
              programmable_transaction_block: '#/components/schemas/SuiProgrammableTransactionBlockDetails'
        chain:
          $ref: '#/components/schemas/EnrichedSuiChain'
          description: The details of the chain this transaction is on.
        version:
          $ref: '#/components/schemas/SuiMessageVersion'
          description: The version of the transaction message.
        inputs:
          items:
            $ref: '#/components/schemas/SuiInput'
          type: array
          title: Inputs
          description: The inputs of the transaction.
        commands:
          items:
            $ref: '#/components/schemas/SuiCommand'
          type: array
          title: Commands
          description: The commands of the transactions.
        sender:
          $ref: '#/components/schemas/EnrichedSuiAddress'
          description: The sender of the transaction.
        recipient:
          description: The recipient of the transaction.
          $ref: '#/components/schemas/EnrichedSuiAddress'
        digest:
          title: Digest
          description: The digest of the transaction.
          type: string
          maxLength: 44
          minLength: 32
          pattern: ^[a-km-zA-HJ-NP-Z1-9]+$
          example: 9K8mnqJdxf3B7vgFmRhj9JqKqsN5AxvSgWk5faGshEta
        tx_bytes:
          title: Tx Bytes
          description: The tx_bytes param encoded as a base64 string.
          type: string
          example: SGVsbG8=
        decoded_tx_bytes:
          title: Decoded Tx Bytes
          description: The json representation of the transaction's data
          type: string
        epoch:
          title: Epoch
          description: The epoch of the transaction.
          type: integer
        gas_submitted:
          $ref: '#/components/schemas/SuiGasConfig'
          description: The gas details submitted for the transaction.
        expected_result:
          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/SuiTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/SuiTransactionResult'
        transaction_block_data:
          title: Transaction Block Data
          description: The json representation of the transaction's data which contains the inputs and commands.
          type: string
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer. For example, Suiscan.
          example: https://suiscan.xyz/mainnet/tx/9K8mnqJdxf3B7v...xvSgWk5faGshEta
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
        fee_payer:
          description: The address that pays the fee for this transaction (gas owner).
          $ref: '#/components/schemas/EnrichedSuiAddress'
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - type
      - sui_transaction_type_details
      - chain
      - version
      - inputs
      - commands
      - sender
      - gas_submitted
      title: SuiTransaction
