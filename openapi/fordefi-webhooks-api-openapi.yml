          format: date-time
          title: Modified At
          description: The date and time when the object was last modified. Any change to any field of the resource is considered a modification.
        managed_transaction_data:
          description: 'Managed transaction data. Presented if the transaction was initiated from the Fordefi system itself, in contrast to unmanaged transactions (which are, for example, transfers of funds into a vault visible to Fordefi). '
          $ref: '#/components/schemas/ManagedTransactionData'
        signatures:
          items:
            $ref: '#/components/schemas/Signature'
          type: array
          title: Signatures
          description: The transaction signatures.
        note:
          title: Note
          description: An optional transaction note.
          type: string
        spam_state:
          $ref: '#/components/schemas/TransactionSpamState'
          description: '`automatically_set` if the transaction was automatically set as spam by Fordefi, `manually_set` if the transaction was manually set as spam by a user, and `unset` if the transaction was not set as spam.'
          default: unset
        direction:
          $ref: '#/components/schemas/TransactionDirection'
          description: The direction of the transaction.
        signed_externally:
          type: boolean
          title: Signed Externally
          description: Whether the transaction was signed by an external user (for example in case of imported vault).
          default: false
        interacted_vaults:
          items:
            $ref: '#/components/schemas/VaultRef'
          type: array
          title: Interacted Vaults
          description: The vaults that interacted with the transaction.
        related_transactions:
          title: Related Transactions
          description: The related transactions.
          items:
            $ref: '#/components/schemas/RelatedTransaction'
          type: array
        organization_id:
          type: string
          format: uuid
          title: Organization Id
          description: The organization that the transaction belongs to.
        block:
          description: The block of the transaction.
          $ref: '#/components/schemas/Block'
        state:
          $ref: '#/components/schemas/PushableTransactionState'
          description: The state of the transaction.
        state_changes:
          items:
            $ref: '#/components/schemas/PushableTransactionStateChange'
          type: array
          title: State Changes
          description: The state changes of the transaction.
        aml_check:
          description: The AML check.
          $ref: '#/components/schemas/AmlCheck'
        mined_result_status:
          description: The mined result status of the transaction.
          $ref: '#/components/schemas/MinedResultStatus'
        simulation_status_result:
          description: Whether simulation succeeded, reverted or failed.
          $ref: '#/components/schemas/SimulationStatusResult'
        type:
          type: string
          const: starknet_transaction
          title: Type
          description: Starknet transaction type.
        starknet_transaction_type_details:
          oneOf:
          - $ref: '#/components/schemas/StarknetNativeTransferDetails'
          - $ref: '#/components/schemas/StarknetErc20TransferDetails'
          - $ref: '#/components/schemas/StarknetRawTransactionDetails'
          - $ref: '#/components/schemas/StarknetContractCreationDetails'
          description: Details of the Starknet transaction based on its type.
          discriminator:
            propertyName: type
            mapping:
              contract_deployment: '#/components/schemas/StarknetContractCreationDetails'
              erc20_transfer: '#/components/schemas/StarknetErc20TransferDetails'
              native_transfer: '#/components/schemas/StarknetNativeTransferDetails'
              raw_transaction: '#/components/schemas/StarknetRawTransactionDetails'
        call_data:
          items:
            $ref: '#/components/schemas/StarknetCallData'
          type: array
          title: Call Data
          description: The call data of the transaction.
        chain:
          $ref: '#/components/schemas/EnrichedStarknetChain'
          description: The details of the chain this transaction is on.
        nonce:
          title: Nonce
          description: The nonce of the transaction.
          type: integer
        sender:
          $ref: '#/components/schemas/EnrichedStarknetAddress'
          description: The sender of the transaction.
        hash:
          title: Hash
          description: The hash of the transaction.
          type: string
          maxLength: 66
          minLength: 66
          pattern: ^0[xX][a-fA-F0-9]+$
          example: '0x0684532b069fb0ce7e22041538a1c5e4850aafae042c772393cd7d795b767c74'
        expected_result:
          description: The expected result of the transaction in case it is mined.
          $ref: '#/components/schemas/StarknetTransactionResult'
        mined_result:
          description: The result of the transaction after it was mined.
          $ref: '#/components/schemas/StarknetTransactionResult'
        explorer_url:
          title: Explorer Url
          description: The URL of this transaction in a blockchain explorer. For example, starkscan.co
          example: https://voyager.online/tx/0x0684532b069fb0ce7e22041538a1c5e4850aafae042c772393cd7d795b767c74
          type: string
          maxLength: 2083
          minLength: 1
          format: uri
        fee_details:
          description: The details of the fee of the transaction.
          $ref: '#/components/schemas/StarknetFeeDetails'
      type: object
      required:
      - id
      - created_at
      - modified_at
      - signatures
      - direction
      - interacted_vaults
      - organization_id
      - state
      - state_changes
      - type
      - starknet_transaction_type_details
      - call_data
      - chain
      - sender
      title: StarknetTransaction
